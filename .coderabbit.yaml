version: 1

reviews:
  auto_review: true              # 자동 리뷰 활성화
  review_status: true            # 체크 메시지 표시
  max_review_comments: 50

  # 모든 브랜치 PR에 대해 자동으로 리뷰
  triggers:
    pull_request: true           # PR 생성 시 자동 리뷰
    pull_request_branches:       # 어떤 브랜치든지 허용
      include:
        - "*"                    # 모든 브랜치
    push: false
    pull_request_review: false

style:
  tone: professional
  detail_level: medium
  include_line_comments: true

exclude:
  paths:
    - "*.md"
    - "*.png"
    - "*.jpg"
    - "*.gif"
    - "*.svg"
    - "build/**"
    - "gradle/**"

model:
  provider: openai
  name: gpt-4o-mini
